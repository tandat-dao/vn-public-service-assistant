  document_number: "Must exactly match a key in DOCUMENT_FILE_MAP in ingest_legal_docs.py"
  article_number: "Must exactly match the relevant_articles entry in the domain YAML, e.g. 'Điều 11' not 'dieu 11'"
  location_scope: "Copy from the YAML. Always 'VN' for national documents"
  procedure_tags: "List of procedure IDs from the YAML. An article relevant to multiple procedures gets all IDs"
  content: "Full article text copied from thuvienphapluat.vn. Paste directly after the | character — no escaping needed."

